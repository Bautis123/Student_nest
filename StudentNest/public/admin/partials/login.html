<section class="login-view" id="loginView">
  <div class="login-panel">
    <img class="login-logo" src="/admin/assets/studentnest-horizontal-cropped.png" alt="Student Nest" />
    <div>
      <h1>Admin Login</h1>
      <p class="muted">Manage landlords, listings, and listing payments from the web.</p>
    </div>

    <form class="login-form" id="loginForm" method="post" action="/admin/">
      <label>
        Phone number
        <input id="phoneInput" name="phone" autocomplete="username" required />
      </label>
      <label>
        Password
        <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button id="loginSubmitButton" type="button">Sign in</button>
      <p class="form-message" id="loginMessage"></p>
    </form>
  </div>
</section>
