<section class="view" id="overviewPanel">
  <header class="topbar">
    <div>
      <p class="eyebrow">Lusaka operations</p>
      <h1>Admin Dashboard</h1>
      <p class="muted" id="adminWelcomeText">Review platform health, approvals, listings, and payments.</p>
    </div>
    <button class="ghost-button" type="button" data-refresh>Refresh</button>
  </header>

  <section class="dashboard-stats" id="statsGrid"></section>

  <div class="overview-grid">
    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Recent activity</h2>
          <p class="muted small">Newest landlords, properties, and payments.</p>
        </div>
      </div>
      <div class="activity-list" id="activityList"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Quick actions</h2>
          <p class="muted small">Jump into the work that protects trust.</p>
        </div>
      </div>
      <div class="quick-actions">
        <button class="quick-action-card" type="button" data-tab-shortcut="landlords">
          <span class="quick-action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M16 19v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M10 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8" /></svg>
          </span>
          <span class="quick-action-copy">
            <strong>Review landlords</strong>
            <span id="pendingLandlordsShortcut">Pending approvals</span>
          </span>
          <span class="quick-action-chevron" aria-hidden="true">&rsaquo;</span>
        </button>
        <button class="quick-action-card" type="button" data-tab-shortcut="properties">
          <span class="quick-action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-7h6v7" /></svg>
          </span>
          <span class="quick-action-copy">
            <strong>Review properties</strong>
            <span id="pendingPropertiesShortcut">Pending listings</span>
          </span>
          <span class="quick-action-chevron" aria-hidden="true">&rsaquo;</span>
        </button>
        <button class="quick-action-card" type="button" data-tab-shortcut="payments">
          <span class="quick-action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 7h18v10H3zM3 10h18M7 15h3" /></svg>
          </span>
          <span class="quick-action-copy">
            <strong>Check payments</strong>
            <span id="paymentsShortcut">Manual reviews</span>
          </span>
          <span class="quick-action-chevron" aria-hidden="true">&rsaquo;</span>
        </button>
      </div>
    </section>
  </div>
</section>
